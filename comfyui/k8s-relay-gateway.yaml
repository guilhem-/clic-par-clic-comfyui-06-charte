# Image server relay WITH the image charter gateway (module 6).
# The relay is an nginx that forwards HTTP and WebSocket to ComfyUI (here, ComfyUI runs in another
# cluster with the GPU, published on host.docker.internal:8090 under the host name comfyui.localhost;
# adapt the two proxy_pass lines and COMFYUI_UPSTREAM / COMFYUI_HOST to your setup).
# Second container, the gateway (gateway/gateway.py, Python standard library): nginx sends it only the
# job submission addresses (/prompt, /api/prompt); it has the workflow's texts classified by a model of
# Open WebUI, on behalf of the "Image charter" robot account, then refuses (HTTP 400 in ComfyUI's
# format, one log line) or forwards the request unchanged.
# Code and charter: ConfigMap comfyui-gateway; robot account: Secret comfyui-gateway (see README).
# Back to the plain relay: kubectl apply -f k8s-relay.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-relay
  namespace: comfyui
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }
    server {
      listen 8188;
      client_max_body_size 100m;           # images sent to ComfyUI (edits)
      location = /relay-health { access_log off; return 200 "ok\n"; }
      # Submitting a job to ComfyUI's queue: the only door, checked by the gateway.
      location ~ ^/(api/)?prompt$ {
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
      }
      # Everything else (images, history, web socket, interface) goes straight to ComfyUI.
      location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host comfyui.localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-relay
  namespace: comfyui
spec:
  replicas: 1
  selector:
    matchLabels: { app: comfyui-relay }
  template:
    metadata:
      labels: { app: comfyui-relay }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports: [{ containerPort: 8188 }]
          readinessProbe:
            httpGet: { path: /relay-health, port: 8188 }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
        - name: gateway
          image: python:3.13.16-slim
          command: ["python", "/app/gateway.py"]
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: TZ, value: "CET-1CEST,M3.5.0,M10.5.0/3" }   # Paris time in the log (no time zone database in the image)
            - { name: OWUI_INTERNAL, value: "http://open-webui.terminals.svc.cluster.local:8080" }
            - { name: CHARTER_MODEL, value: "gpt-5.6-luna" }
            - { name: CHARTER, value: /app/charter.md }
            - { name: COMFYUI_UPSTREAM, value: "http://host.docker.internal:8090" }
            - { name: COMFYUI_HOST, value: "comfyui.localhost" }
            - { name: ROBOT_EMAIL, valueFrom: { secretKeyRef: { name: comfyui-gateway, key: ROBOT_EMAIL } } }
            - { name: ROBOT_PASSWORD, valueFrom: { secretKeyRef: { name: comfyui-gateway, key: ROBOT_PASSWORD } } }
            - { name: REFUSAL_MESSAGE, value: "Request refused by the Example Company image charter" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: gateway, mountPath: /app, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: comfyui-relay }
        - name: gateway
          configMap: { name: comfyui-gateway }
